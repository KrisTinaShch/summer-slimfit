<!DOCTYPE html>
<html lang="bg-BG">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcha Slimfit</title>

    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="matcha-results">
        <div class="ks-container">
            <div class="before-after__slider">

                <div class="before-after__slider-item">
                    <div class="before-after-container">
                        <div class="before-image">
                            <img src="/images/matcha-slimfit-lp-3-after.webp" alt="After" class="ks-image">
                        </div>
                        <div class="after-image">
                            <img src="/images/matcha-slimfit-lp-3-before.webp" alt="Before" class="ks-image">
                        </div>

                        <input type="range" class="slider" min="0" max="100" value="50">
                        <div class="slider-handle"></div>
                    </div>

                    <div class="before-after__text">
                        <small>ден 1</small>
                        <p class="ks-paragraph">Прогресът на Лили</p>
                        <small>ден 21</small>
                    </div>

                </div>

                <div class="before-after__slider-item">
                    <div class="before-after-container">
                        <div class="before-image">

                            <img src="/images/matcha-slimfit-lp-1-after.webp" alt="After" class="ks-image">
                        </div>
                        <div class="after-image">
                            <img src="/images/matcha-slimfit-lp-1-before.webp" alt="Before" class="ks-image">
                        </div>

                        <input type="range" class="slider" min="0" max="100" value="50">
                        <div class="slider-handle"></div>
                    </div>

                    <div class="before-after__text">
                        <small>ден 1</small>
                        <p class="ks-paragraph">Прогресът на Ема</p>
                        <small>ден 21</small>
                    </div>

                </div>
                <div class="before-after__slider-item">
                    <div class="before-after-container">
                        <div class="before-image">

                            <img src="/images/matcha-slimfit-lp-2-after.webp" alt="After" class="ks-image">
                        </div>
                        <div class="after-image">
                            <img src="/images/matcha-slimfit-lp-2-before.webp" alt="Before" class="ks-image">
                        </div>

                        <input type="range" class="slider" min="0" max="100" value="50">
                        <div class="slider-handle"></div>
                    </div>

                    <div class="before-after__text">
                        <small>ден 1</small>
                        <p class="ks-paragraph">Прогресът на Вики</p>
                        <small>ден 21</small>
                    </div>

                </div>
            </div>
        </div>
    </section>

</body>
<script type="text/javascript" src="//code.jquery.com/jquery-1.11.0.min.js"></script>
<script type="text/javascript" src="//code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
<script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
<script src="scripts.js"></script>

</html>
